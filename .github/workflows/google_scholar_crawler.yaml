name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
  push:
    branches: [main]
    paths:
      - '_data/publications.json'
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current Google Scholar counts
        run: python google_scholar_crawler/refresh.py --output /tmp/scholar-results
      - name: Publish badge data
        run: |
          git fetch origin google-scholar-stats
          git checkout -B google-scholar-stats origin/google-scholar-stats
          cp /tmp/scholar-results/metrics.json metrics.json
          mkdir -p badges
          cp /tmp/scholar-results/badges/*.json badges/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics.json badges
          git diff --staged --quiet && exit 0
          git commit -m 'Refresh Google Scholar citation badges'
          git push origin HEAD:google-scholar-stats
